# Maze layout of Figure 1 of the IE4060 Assignment 02 brief, taken from main's
# generate_maze.py (JayangaWeerasinghe): 7 columns x 6 rows of 0.5 m cells,
# 3.5 m x 3.0 m. Cells are (row, col), row 0 = top of the figure (+y), col 0 = left.
# Unlike the earlier 6x6 layout this maze is NOT centred on the world origin:
# its outer walls span x=[-0.5, 3.0], y=[-0.5, 2.5], so the centre is (1.25, 1.0).
# Wall geometry (thin 0.01 m, 0.2 m high) is main's, as in worlds/custom_maze.sdf.
cell_size_m: 0.5
rows: 6
cols: 7
center_x_m: 1.25
center_y_m: 1.0
wall_thickness_m: 0.01
wall_height_m: 0.2
# Interior vertical walls: [col_line, row]  (col_line 1..6 lies between cols)
vertical_walls:
  - [1, 1]
  - [1, 2]
  - [1, 3]
  - [2, 0]
  - [2, 2]
  - [3, 1]
  - [3, 3]
  - [4, 0]
  - [4, 2]
  - [5, 1]
  - [5, 3]
# Interior horizontal walls: [row_line, col]  (row_line 1..5 lies between rows)
horizontal_walls:
  - [2, 2]
  - [2, 3]
  - [2, 4]
  - [3, 4]
  - [4, 1]
  - [4, 2]
  - [4, 3]
# Robot start and the three evaluation goals, as (row, col) cells.
start_cell: [5, 1]
goal_cells:
  - [0, 3]
  - [3, 3]
  - [3, 0]
