# Maze layout transcribed from Figure 1 of the IE4060 Assignment 02 brief.
# 6 x 6 grid, 0.5 m cells => 3.0 m x 3.0 m. Cells are (row, col), row 0 = top
# of the figure (+y), col 0 = left (-x). World origin is the maze centre.
# Wall positions were measured from the figure's pixel line thickness
# (thick line = wall, thin line = open cell boundary), not guessed.
cell_size_m: 0.5
rows: 6
cols: 6
wall_thickness_m: 0.05
wall_height_m: 0.5
# Interior vertical walls: [col_line, row]  (col_line 1..5 lies between cols)
vertical_walls:
  - [1, 1]
  - [1, 2]
  - [1, 3]
  - [2, 0]
  - [2, 2]
  - [3, 1]
  - [3, 3]
  - [4, 0]
  - [4, 2]
  - [5, 1]
  - [5, 3]
  - [5, 4]
# Interior horizontal walls: [row_line, col]  (row_line 1..5 lies between rows)
horizontal_walls:
  - [2, 2]
  - [2, 3]
  - [2, 4]
  - [3, 4]
  - [3, 5]
  - [4, 1]
  - [4, 2]
  - [4, 3]
  - [5, 0]
  - [5, 2]
  - [5, 3]
  - [5, 4]
# Robot start and the three evaluation goals, as (row, col) cells.
# The brief does not fix these; chosen so the three goals need different
# route lengths/turn counts. Reachability is checked by maze_tools.py.
start_cell: [5, 0]
goal_cells:
  - [0, 5]
  - [2, 0]
  - [3, 3]
