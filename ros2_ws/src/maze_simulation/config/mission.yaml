# Robot start and the three evaluation goals as (row, col) cells of the Figure 1 maze in
# worlds/custom_maze.sdf (main's world, unmodified; the maze itself is read from that file).
# Row 0 = top (+y), col 0 = left (-x); cell centres are 0.5 m apart, maze x -0.5..3.0, y -0.5..2.5.
# The brief does not fix start or goals; the goals are chosen for different route lengths.
# spawn_xy is the original spawn of custom_maze.launch.py (0.25, 0.0), yaw 0. It lies on the boundary of
# cells (4,1) and (5,1); start_cell (5,1) is used for the cell graph / reference path lengths.
spawn_xy: [0.25, 0.0]
start_cell: [5, 1]
goal_cells:
  - [0, 3]
  - [3, 3]
  - [3, 0]
